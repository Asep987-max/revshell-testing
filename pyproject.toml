[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta:__legacy__"

[project]
name = "poc-shell"
version = "0.0.1"
description = "poc shell"
requires-python = ">=3.8"
license = {text = "MIT"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["poc_shell*"]
